name: Apply Acer Atlas cultivar patch

on:
  push:
    paths:
      - "incoming/cultivar-patches/*.json"

permissions:
  contents: write

jobs:
  apply-patch:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install WebP optimizer
        run: npm install --no-save sharp

      - name: Apply validated cultivar patch, optimize embedded photos and back up database
        run: |
          node <<'NODE'
          const fs = require('fs');
          const path = require('path');
          const sharp = require('sharp');

          (async () => {
            const patchPath = process.env.GITHUB_WORKSPACE + '/incoming/cultivar-patches/hyohtei.json';
            const livePath = 'cultivar-database.json';
            const patch = JSON.parse(fs.readFileSync(patchPath, 'utf8'));
            const db = JSON.parse(fs.readFileSync(livePath, 'utf8'));

            if (!Array.isArray(db.records)) throw new Error('Database records array missing');
            if (db.version !== patch.expected_database_version) {
              throw new Error('Database version mismatch: expected ' + patch.expected_database_version + ', found ' + db.version);
            }
            const record = db.records.find(item => item.id === patch.record_id);
            if (!record) throw new Error('Cultivar record not found: ' + patch.record_id);

            const photosBefore = JSON.stringify(record.photos || []);
            for (const [key, value] of Object.entries(patch.updates)) {
              if (key === 'id' || key === 'photos') throw new Error('Patch cannot replace id or photos');
              record[key] = value;
            }
            if (JSON.stringify(record.photos || []) !== photosBefore) {
              throw new Error('Existing cultivar photos changed unexpectedly');
            }

            let optimized = 0;
            let savedBytes = 0;
            let skipped = 0;
            let totalPhotos = 0;
            for (const cultivar of db.records) {
              for (const photo of (cultivar.photos || [])) {
                totalPhotos++;
                const url = photo && photo.url;
                if (typeof url !== 'string' || !url.startsWith('data:image/webp;base64,')) continue;
                try {
                  const prefix = 'data:image/webp;base64,';
                  const input = Buffer.from(url.slice(prefix.length), 'base64');
                  const output = await sharp(input, { failOn: 'none' })
                    .resize({ width: 1200, height: 1200, fit: 'inside', withoutEnlargement: true })
                    .webp({ quality: 78, effort: 5 })
                    .toBuffer();
                  if (output.length < input.length) {
                    photo.url = prefix + output.toString('base64');
                    optimized++;
                    savedBytes += input.length - output.length;
                  }
                } catch (error) {
                  skipped++;
                  console.log('Photo kept unchanged after optimizer issue:', cultivar.name, error.message);
                }
              }
            }

            db.version = patch.new_database_version;
            db.note = patch.database_note;
            db.record_count = db.records.length;
            db.records_count = db.records.length;

            const ids = db.records.map(item => item.id);
            if (new Set(ids).size !== ids.length) throw new Error('Duplicate cultivar IDs detected');
            if (db.record_count !== db.records.length || db.records_count !== db.records.length) {
              throw new Error('Record count validation failed');
            }

            const backupDir = 'backups';
            fs.mkdirSync(backupDir, { recursive: true });
            const files = fs.readdirSync(backupDir)
              .filter(name => name.startsWith('cultivar-database-v') && name.endsWith('.json'));
            const alreadyBackedUp = files.some(name => {
              try {
                return String(JSON.parse(fs.readFileSync(path.join(backupDir, name), 'utf8')).version) === String(patch.expected_database_version);
              } catch { return false; }
            });
            if (!alreadyBackedUp) {
              const stamp = new Date().toISOString().slice(0, 19).replaceAll('-', '').replaceAll(':', '') + 'Z';
              const backupName = 'cultivar-database-v' + patch.expected_database_version + '-' + stamp + '.json';
              fs.copyFileSync(livePath, path.join(backupDir, backupName));
              console.log('Backup created:', backupName);
            } else {
              console.log('Previous database version already backed up:', patch.expected_database_version);
            }

            const allBackups = fs.readdirSync(backupDir)
              .filter(name => name.startsWith('cultivar-database-v') && name.endsWith('.json'));
            const latestByVersion = new Map();
            for (const name of allBackups) {
              try {
                const filePath = path.join(backupDir, name);
                const version = String(JSON.parse(fs.readFileSync(filePath, 'utf8')).version || 'unknown');
                const previous = latestByVersion.get(version);
                if (!previous || fs.statSync(filePath).mtimeMs > fs.statSync(path.join(backupDir, previous)).mtimeMs) {
                  latestByVersion.set(version, name);
                }
              } catch (error) {
                console.log('Skipping unreadable backup:', name, error.message);
              }
            }
            const compareVersions = (a, b) => {
              const aa = a.split('.').map(Number), bb = b.split('.').map(Number);
              for (let i = 0; i < Math.max(aa.length, bb.length); i++) {
                const diff = (bb[i] || 0) - (aa[i] || 0);
                if (diff) return diff;
              }
              return 0;
            };
            const keep = new Set([...latestByVersion.entries()]
              .sort((a, b) => compareVersions(a[0], b[0]))
              .slice(0, 3)
              .map(entry => entry[1]));
            for (const name of allBackups) {
              if (!keep.has(name)) {
                fs.unlinkSync(path.join(backupDir, name));
                console.log('Removed duplicate or older backup:', name);
              }
            }

            db.photo_count = db.records.reduce((sum, item) => sum + (Array.isArray(item.photos) ? item.photos.length : 0), 0);

            fs.writeFileSync(livePath, JSON.stringify(db));
            console.log('Applied patch to ' + record.name + '; database v' + db.version);
            console.log('Preserved ' + totalPhotos + ' photos across all cultivars');
            console.log('Optimized ' + optimized + ' embedded WebP photos; saved ' + savedBytes + ' bytes');
            console.log('Skipped photo optimizations: ' + skipped);
            console.log('Backup created: ' + backupName);
          })().catch(error => {
            console.error(error);
            process.exit(1);
          });
          NODE

      - name: Commit published database and backup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cultivar-database.json backups/
          git commit -m "Publish Acer Atlas database v8.2.58 — Hyotei and photo optimization"
          git push
