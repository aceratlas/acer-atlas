name: Validate and publish Acer Atlas database

on:
  push:
    paths:
      - "incoming/cultivar-database.json"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate database JSON and structure
        run: |
          node <<'NODE'
          const fs = require('fs');
          const path = 'incoming/cultivar-database.json';
          if (!fs.existsSync(path)) {
            throw new Error('Missing incoming/cultivar-database.json');
          }
          const raw = fs.readFileSync(path, 'utf8');
          const db = JSON.parse(raw);
          if (!db || typeof db !== 'object' || Array.isArray(db)) {
            throw new Error('Database root must be a JSON object');
          }
          if (!Array.isArray(db.records)) {
            throw new Error('Database must contain a records array');
          }
          if (db.records.length === 0) {
            throw new Error('Database records array is empty');
          }
          if (Number(db.record_count) !== db.records.length ||
              Number(db.records_count) !== db.records.length) {
            throw new Error('record_count and records_count must both match records.length');
          }
          if (!db.version || typeof db.version !== 'string') {
            throw new Error('Database version is missing');
          }
          const ids = new Set();
          for (const record of db.records) {
            if (!record || typeof record !== 'object' || !record.id || !record.name) {
              throw new Error('Every record must have an id and name');
            }
            if (ids.has(record.id)) {
              throw new Error('Duplicate cultivar id: ' + record.id);
            }
            ids.add(record.id);
          }
          console.log(`Validated database v${db.version}: ${db.records.length} records`);
          NODE

      - name: Back up current database and keep latest three distinct versions
        run: |
          node <<'NODE'
          const fs = require('fs');
          const path = require('path');
          const livePath = 'cultivar-database.json';
          const backupDir = 'backups';
          const compareVersions = (a, b) => {
            const aa = String(a).split('.').map(Number);
            const bb = String(b).split('.').map(Number);
            for (let i = 0; i < Math.max(aa.length, bb.length); i++) {
              const diff = (bb[i] || 0) - (aa[i] || 0);
              if (diff) return diff;
            }
            return 0;
          };
          if (fs.existsSync(livePath)) {
            const current = JSON.parse(fs.readFileSync(livePath, 'utf8'));
            const version = String(current.version || 'unknown').replace(/[^0-9A-Za-z._-]/g, '_');
            fs.mkdirSync(backupDir, { recursive: true });
            const files = fs.readdirSync(backupDir)
              .filter(name => name.startsWith('cultivar-database-v') && name.endsWith('.json'));
            const alreadyBackedUp = files.some(name => {
              try {
                return String(JSON.parse(fs.readFileSync(path.join(backupDir, name), 'utf8')).version) === String(current.version);
              } catch { return false; }
            });
            if (!alreadyBackedUp) {
              const stamp = new Date().toISOString().slice(0, 19).replaceAll('-', '').replaceAll(':', '') + 'Z';
              const backupPath = path.join(backupDir, `cultivar-database-v${version}-${stamp}.json`);
              fs.copyFileSync(livePath, backupPath);
              console.log('Created backup:', backupPath);
            } else {
              console.log('Previous version already backed up:', current.version);
            }
            const allFiles = fs.readdirSync(backupDir)
              .filter(name => name.startsWith('cultivar-database-v') && name.endsWith('.json'));
            const latestByVersion = new Map();
            for (const name of allFiles) {
              try {
                const filePath = path.join(backupDir, name);
                const data = JSON.parse(fs.readFileSync(filePath, 'utf8'));
                const v = String(data.version || 'unknown');
                const previous = latestByVersion.get(v);
                if (!previous || fs.statSync(filePath).mtimeMs > fs.statSync(path.join(backupDir, previous)).mtimeMs) {
                  latestByVersion.set(v, name);
                }
              } catch (error) {
                console.log('Skipping unreadable backup:', name, error.message);
              }
            }
            const keep = new Set([...latestByVersion.entries()]
              .sort((a, b) => compareVersions(a[0], b[0]))
              .slice(0, 3)
              .map(entry => entry[1]));
            for (const name of allFiles) {
              if (!keep.has(name)) {
                fs.unlinkSync(path.join(backupDir, name));
                console.log('Removed duplicate or older backup:', name);
              }
            }
            console.log('Retained distinct database versions:', [...keep].join(', '));
          } else {
            console.log('No previous live database; first publication has no backup.');
          }
          NODE

      - name: Optimize embedded cultivar photos
        run: |
          npm install --no-save --no-package-lock sharp
          node <<'NODE'
          const fs = require('fs');
          const sharp = require('sharp');
          (async () => {
            const file = 'incoming/cultivar-database.json';
            const db = JSON.parse(fs.readFileSync(file, 'utf8'));
            let checked = 0, changed = 0, beforeBytes = 0, afterBytes = 0;
            for (const record of db.records || []) {
              for (const photo of record.photos || []) {
                if (typeof photo.url !== 'string') continue;
                const match = photo.url.match(/^data:image\/([a-z0-9.+-]+);base64,([\s\S]+)$/i);
                if (!match) continue;
                const format = match[1].toLowerCase();
                if (format === 'gif' || format === 'svg+xml') continue;
                const input = Buffer.from(match[2], 'base64');
                if (!input.length) continue;
                checked++;
                beforeBytes += input.length;
                try {
                  const metadata = await sharp(input, { animated: true }).metadata();
                  if (!metadata.width || !metadata.height || (metadata.pages && metadata.pages > 1)) {
                    afterBytes += input.length;
                    continue;
                  }
                  const output = await sharp(input)
                    .rotate()
                    .resize({ width: 1600, height: 1600, fit: 'inside', withoutEnlargement: true })
                    .webp({ quality: 78, effort: 4 })
                    .toBuffer();
                  if (output.length < input.length * 0.97) {
                    photo.url = 'data:image/webp;base64,' + output.toString('base64');
                    afterBytes += output.length;
                    changed++;
                  } else {
                    afterBytes += input.length;
                  }
                } catch (error) {
                  afterBytes += input.length;
                  console.log('Kept original photo in', record.name || record.id, '-', error.message);
                }
              }
            }
            fs.writeFileSync(file, JSON.stringify(db));
            const saved = beforeBytes ? ((beforeBytes - afterBytes) / beforeBytes * 100).toFixed(1) : '0.0';
            console.log(`Photo optimization: ${changed}/${checked} images reduced; embedded photo bytes ${beforeBytes} -> ${afterBytes} (${saved}% smaller).`);
            console.log('Database JSON minified and saved.');
          })().catch(error => { console.error(error); process.exit(1); });
          NODE
      - name: Publish validated database
        run: |
          cp incoming/cultivar-database.json cultivar-database.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cultivar-database.json backups/
          if git diff --cached --quiet; then
            echo "No database changes to publish."
            exit 0
          fi
          VERSION=$(node -p "require('./cultivar-database.json').version")
          git commit -m "Publish Acer Atlas cultivar database v${VERSION}"
          git push
