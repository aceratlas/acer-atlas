
name: Deploy Acer Atlas Firestore rules

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy-firestore-rules:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate Firebase service account secret
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_ACER_ATLAS }}
        run: |
          if [ -z "$FIREBASE_SERVICE_ACCOUNT" ]; then
            echo "::error::Missing GitHub Actions secret FIREBASE_SERVICE_ACCOUNT_ACER_ATLAS."
            exit 1
          fi

          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$RUNNER_TEMP/firebase-service-account.json"

          node - "$RUNNER_TEMP/firebase-service-account.json" <<'NODE'
          const fs = require('fs');
          const x = JSON.parse(fs.readFileSync(process.argv[2], 'utf8'));

          if (!x.project_id || !x.client_email || !x.private_key) {
            console.error('Invalid Firebase service account JSON.');
            process.exit(1);
          }

          console.log('Firebase project:', x.project_id);
          console.log('Service account:', x.client_email);
          console.log('Private key: present (hidden)');
          NODE

          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/firebase-service-account.json" >> "$GITHUB_ENV"

      - name: Deploy Firestore rules only
        run: npx --yes firebase-tools deploy --only firestore:rules --project acer-atlas --non-interactive
